<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>外卖分析师工作平台</title>
  <style>
    :root {
      --primary: #E2382E;
      --primary-dark: #C42A22;
      --primary-light: #FF6B5E;
      --accent: #FF9800;
      --bg: #F5F6FA;
      --card: #FFFFFF;
      --text: #1A1A2E;
      --text-secondary: #6B7280;
      --border: #E5E7EB;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
      --radius: 16px;
      --radius-sm: 10px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    /* ===== Header ===== */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      padding: 20px 24px 60px;
      position: relative;
      overflow: hidden;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: 0; right: 0;
      height: 80px;
      background: var(--bg);
      border-radius: 50% 50% 0 0;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .jd-dog {
      width: 48px;
      height: 48px;
      background: #fff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      overflow: hidden;
      padding: 0;
    }
    .jd-dog img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .app-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .app-subtitle {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .header-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
    }
    .header-btn:hover { background: rgba(255,255,255,0.35); }
    /* ===== Stats Bar ===== */
    .stats-bar {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      padding: 0 4px;
    }
    .stat-item {
      flex: 1;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }
    .stat-value { font-size: 22px; font-weight: 700; }
    .stat-label { font-size: 11px; opacity: 0.8; margin-top: 2px; }

    /* ===== Main Content ===== */
    .main {
      padding: 0 16px 90px;
      margin-top: -30px;
      position: relative;
      z-index: 1;
    }

    /* ===== Tab Navigation ===== */
    .tab-nav {
      display: flex;
      background: var(--card);
      border-radius: 14px;
      padding: 5px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(226,56,46,0.3);
    }
    .tab-btn:not(.active):hover { background: #f3f4f6; }

    /* ===== Tab Content ===== */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ===== Section Title ===== */
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title .icon { font-size: 20px; }

    /* ===== News Cards ===== */
    .news-list { display: flex; flex-direction: column; gap: 12px; }
    .news-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .news-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .news-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .news-source {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      color: #fff;
    }
    .source-hongcan { background: #E53935; }
    .source-toutiao { background: #F44336; }
    .source-36kr { background: #009688; }
    .source-ifeng { background: #FF6F00; }
    .source-waimai { background: var(--primary); }
    .source-keji { background: #1976D2; }
    .news-time { font-size: 12px; color: var(--text-secondary); }
    .news-title { font-size: 15px; font-weight: 600; line-height: 1.5; margin-bottom: 6px; }
    .news-summary { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .news-tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .news-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #FEF2F2;
      color: var(--primary);
    }

    /* ===== Knowledge Base ===== */
    .kb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .kb-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px 16px;
      box-shadow: var(--shadow);
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .kb-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .kb-icon { font-size: 36px; margin-bottom: 10px; }
    .kb-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .kb-count { font-size: 12px; color: var(--text-secondary); }

    .kb-detail {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-top: 14px;
    }
    .kb-detail-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .kb-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
    }
    .kb-item:last-child { border-bottom: none; }
    .kb-item:hover { background: #fafafa; }
    .kb-item-icon { font-size: 20px; }
    .kb-item-text { flex: 1; }
    .kb-item-title { font-size: 14px; font-weight: 500; }
    .kb-item-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .kb-item-arrow { color: #ccc; font-size: 14px; }

    /* ===== Quiz Section ===== */
    .quiz-categories { display: flex; flex-direction: column; gap: 12px; }
    .quiz-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .quiz-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .quiz-card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .quiz-emoji { font-size: 32px; }
    .quiz-info { flex: 1; }
    .quiz-name { font-size: 15px; font-weight: 600; }
    .quiz-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .quiz-progress-bar {
      height: 6px;
      background: #eee;
      border-radius: 3px;
      overflow: hidden;
    }
    .quiz-progress-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.5s;
    }
    .quiz-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ===== Quiz Modal ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      top:0;left:0;right:0;bottom:0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: var(--radius);
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-title { font-size: 18px; font-weight: 700; }
    .modal-close {
      border: none;
      background: #f3f4f6;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }
    .quiz-question {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .quiz-options { display: flex; flex-direction: column; gap: 10px; }
    .quiz-option {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
      text-align: left;
    }
    .quiz-option:hover { border-color: var(--primary-light); background: #FFF5F5; }
    .quiz-option.correct { border-color: #4CAF50; background: #E8F5E9; }
    .quiz-option.wrong { border-color: #F44336; background: #FFEBEE; }
    .quiz-option.selected { border-color: var(--primary); background: #FFF5F5; }
    .quiz-result {
      text-align: center;
      padding: 20px;
    }
    .quiz-result-icon { font-size: 48px; margin-bottom: 12px; }
    .quiz-result-text { font-size: 16px; font-weight: 600; }
    .quiz-result-score { font-size: 36px; font-weight: 700; color: var(--primary); margin: 10px 0; }
    .quiz-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .quiz-btn:hover { background: var(--primary-dark); }

    /* ===== Article Modal ===== */
    .article-content { line-height: 1.8; font-size: 14px; color: #333; }
    .article-content p { margin-bottom: 12px; }
    .article-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }

    /* ===== Bottom Navigation ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex;
      padding: 8px 0;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 11px;
      transition: color 0.2s;
    }
    .nav-item.active { color: var(--primary); }
    .nav-item .nav-icon { font-size: 22px; }
    .nav-item .nav-icon svg { width: 24px; height: 24px; }
    .nav-item .nav-icon svg path,
    .nav-item .nav-icon svg circle,
    .nav-item .nav-icon svg rect,
    .nav-item .nav-icon svg line,
    .nav-item .nav-icon svg polyline {
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item .nav-icon svg .filled { fill: currentColor; }

    /* ===== Refresh indicator ===== */
    .refresh-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--card);
      border-radius: 10px;
    }
    .refresh-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4CAF50;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ===== Scrollbar ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    /* ===== Responsive ===== */
    @media (min-width: 600px) {
      .main { max-width: 540px; margin-left: auto; margin-right: auto; }
    }
  </style>
</head>

      { icon: '🔑', title: '饿了么流量获取策略', desc: '搜索排名与活动运营技巧', content: '## 饿了么流量获取策略\n\n### 一、搜索排名优化\n1. **关键词优化**：菜品名包含热门搜索词\n   - 在菜品名中加入品类词：如"红烧牛肉面（招牌·大份）"而非仅"牛肉面"\n   - 利用后台搜索热词工具，每周更新菜品关键词\n   - 避免堆砌关键词，保持菜品名自然可读\n2. **销量积累**：新店期通过补贴快速积累基础销量\n   - 前7天目标：单品类月销突破100单\n   - 新客立减+首单红包叠加，快速起量\n   - 好评率保持在95%以上\n3. **评分维护**：保持4.6分以上，搜索权重更高\n   - 评分每提升0.1分，搜索排名提升约5位\n   - 4.8分以上的店铺可获得"优质商家"标识\n4. **配送速度**：平均配送时长<30分钟的店铺排名更靠前\n   - 优化出餐流程，控制在15分钟以内\n   - 合理设置配送范围，避免远距离订单拉低时效\n\n### 二、活动流量获取\n- **超级会员日**：每周固定参与，流量提升30%\n  - 建议设置会员专属满减，吸引高价值用户\n  - 会员客单价通常比普通用户高20-30%\n- **百亿补贴**：配合平台补贴力度，获取首页推荐位\n  - 选择1-2款引流爆品参与，不要求全品参与\n  - 补贴商品建议选择毛利率>60%的菜品\n- **限时秒杀**：设置1-2款爆品参与，引流效果显著\n  - 秒杀时段建议选在10:30-11:30或16:30-17:30\n  - 秒杀价控制在日常价的5-7折\n- **品牌日**：连锁品牌专属资源位\n  - 需提前1周向运营申请\n  - 当天订单量可达日常的2-3倍\n\n### 三、付费推广\n- **搜索推广**：CPC竞价，建议出价0.5-1.5元/点击\n  - 新店建议从0.5元起，观察3天后调整\n  - 关注ROI，低于1.5需要优化关键词或降低出价\n  - 高峰时段（11-12点、17-18点）可适当提高出价\n- **首页Banner**：CPM展示，适合品牌曝光\n  - 适合连锁品牌或新店开业推广\n  - 单次展示成本约0.01-0.03元\n- **店铺红包**：精准触达，ROI通常>3\n  - 设置2-3元红包，门槛为平均客单价1.2倍\n  - 红包核销率一般在30-50%\n\n### 四、私域运营\n- 建立饿了么粉丝群，定期推送专属优惠\n- 设置会员专属优惠，提升复购率\n- 利用店铺公告引导用户收藏店铺\n- 定期推送新品和活动，保持用户活跃\n- 节日专属福利：如生日当月专属折扣\n\n### 五、饿了么与美团差异化运营\n| 维度 | 饿了么 | 美团 |\n|------|--------|------|\n| 用户画像 | 偏年轻白领 | 更广泛 |\n| 价格敏感度 | 中等 | 较高 |\n| 活动力度 | 百亿补贴力度大 | 神券节力度大 |\n| 推荐策略 | 侧重品牌品质 | 侧重性价比 |\n| 运营重点 | 会员运营+品牌建设 | 满减策略+搜索优化 |' },
      { icon: '📱', title: '抖音外卖直播运营', desc: '直播话术与转化率提升', content: '## 抖音外卖直播运营指南\n\n### 一、直播前准备\n1. **直播间搭建**：干净明亮的厨房背景最佳\n   - 背景：干净的白色/暖色调厨房，避免杂乱\n   - 灯光：主灯+补光灯，确保食物色泽诱人\n   - 镜头：固定机位+特写机位双机位切换\n2. **设备准备**：手机支架+补光灯+收音麦\n   - 手机：建议iPhone 13以上或旗舰安卓\n   - 收音麦：领夹麦最佳，避免环境噪音\n   - 网络：确保5GHz WiFi或5G信号稳定\n3. **选品策略**：选3-5款高利润+高颜值爆品\n   - 必须有1款"引流款"：价格低、颜值高、容易展示\n   - 2-3款"利润款"：正常利润，搭配套餐销售\n   - 1款"招牌款"：品牌代表菜，展示实力\n4. **话术准备**：每款菜品的卖点话术+限时话术\n   - 提前写好话术卡片，放在镜头旁\n   - 准备3-5个互动话题（如"你们那边外卖一般多少钱"）\n\n### 二、直播话术模板\n- **开场引流**：「家人们，今天给大家准备了XX爆款，限时5折！只有50份！」\n- **菜品展示**：「看这个色泽，用的是XX食材，平时店里卖XX，今天直播间只要XX」\n  - 展示时动作：近距离特写→夹起展示→慢动作入口\n  - 声音配合：咀嚼声ASMR效果极佳\n- **逼单话术**：「还剩最后10份！拍完就没了，没抢到的家人们抓紧了」\n  - 配合倒计时：屏幕显示倒计时增加紧迫感\n  - 重复引导：每5分钟重复一次下单入口\n- **互动引导**：「想要XX口味的扣1，想要XX的扣2」\n  - 根据弹幕互动调整展示顺序\n  - 回复用户问题增加信任感\n\n### 三、转化率提升技巧\n1. 限时限量制造紧迫感（每款菜限50-100份）\n2. 直播间专属价（比搜索价低10-20%）\n3. 满减叠加：直播价+店铺满减，双重优惠\n4. 频繁展示下单入口和操作步骤（每3分钟引导一次）\n5. 制造"意外惊喜"：如"刚刚老板说再加50份"\n6. 用户晒单互动：下单后截图发弹幕，抽免单\n\n### 四、直播数据复盘\n- 观看人数 → 下单转化率（目标>5%）\n  - 转化率<3%：检查选品和话术\n  - 转化率3-5%：正常水平，可优化\n  - 转化率>5%：优秀，加大投放\n- 平均停留时长（目标>3分钟）\n  - <1分钟：开场不够吸引，优化前3分钟\n  - 1-3分钟：一般，增加互动环节\n  - >3分钟：优秀\n- 退货率（控制在5%以内）\n- 单场ROI（目标>2.0）\n\n### 五、直播排期建议\n| 时段 | 适合品类 | 预期观看 |\n|------|----------|----------|\n| 11:00-13:00 | 午餐快餐 | 高 |\n| 14:00-16:00 | 下午茶甜品 | 中 |\n| 17:00-19:00 | 晚餐正餐 | 高 |\n| 21:00-23:00 | 夜宵烧烤 | 中高 |\n\n### 六、抖音外卖vs传统外卖运营差异\n- 抖音外卖更依赖"内容力"，而非"搜索力"\n- 直播是核心流量来源，不直播=没流量\n- 短视频是日常引流手段，建议每天1-3条\n- 达人探店合作是快速起量的有效方式' },
      { icon: '💰', title: '满减与定价策略', desc: '科学的满减设置方法', content: '## 满减与定价策略\n\n### 一、定价公式\n菜品定价 = 食材成本 × 3~4倍\n外卖到手价 = 菜品价 × (1-平台佣金率) - 满减让利 - 包装费\n\n**详细拆解**：\n- 食材成本占比：25-35%（含主料+辅料+调料）\n- 包装成本：2-5元/单\n- 平台佣金：18-25%（含配送费分摊）\n- 满减让利：5-15%\n- 目标毛利率：35-50%\n\n**定价示例**：\n```\n菜品：宫保鸡丁\n食材成本：6元（鸡肉3元+花生1元+调料2元）\n定价：6 × 3.5 = 21元\n到手收入：21 × (1-20%) - 3(包装) = 13.8元\n毛利：13.8 - 6 = 7.8元\n毛利率：7.8/13.8 = 56.5%\n```\n\n### 二、满减设置原则\n1. **门槛设计**：满减门槛 = 客单价 × 1.3~1.5倍\n   - 如果平均客单价30元，第一档门槛设为满38-45元\n   - 门槛太低=亏钱，太高=没人凑\n2. **梯度设计**：3-4档满减，覆盖不同消费场景\n   - 每档之间差价8-15元\n   - 让利比例递减（第一档让利比例最高，最后一档最低）\n3. **让利控制**：综合让利不超过25%\n   - 综合让利 = 满减金额 + 红包 + 活动补贴\n   - 超过25%基本不赚钱甚至亏钱\n\n### 三、常见满减组合\n| 档位 | 满减设置 | 让利比例 | 目标场景 |\n|------|----------|----------|----------|\n| 第1档 | 满25减5 | 20% | 一人食，提升下单率 |\n| 第2档 | 满40减10 | 25% | 一人食升级，提升客单价 |\n| 第3档 | 满60减16 | 26.7% | 两人餐场景 |\n| 第4档 | 满80减22 | 27.5% | 团餐/多人场景 |\n\n### 四、不同品类的满减策略\n| 品类 | 客单价 | 建议满减 | 特别注意 |\n|------|--------|----------|----------|\n| 快餐便当 | 20-30元 | 满25减5 / 满38减8 | 避免单档满减，凑单率低 |\n| 茶饮 | 15-25元 | 满20减3 / 满35减6 | 套餐搭配提升客单价 |\n| 火锅烧烤 | 60-120元 | 满80减12 / 满120减20 | 关注套餐组合 |\n| 甜点 | 25-40元 | 满30减5 / 满50减9 | 下午茶时段加大力度 |\n\n### 五、定价避坑\n- ❌ 不要全品同价，缺少价格带层次\n- ❌ 不要满减门槛低于平均客单价（白送钱）\n- ❌ 不要忽略包装费对到手价的影响\n- ❌ 不要照搬竞品定价，每家成本结构不同\n- ✅ 定期根据数据调整满减档位（建议每月1次）\n- ✅ 爆品定价可略低，引流款+利润款组合\n- ✅ 设置"凑单品"：3-5元的饮料/小食，帮用户凑满减\n- ✅ 新品上市前2周定价略高，给后续活动留空间\n\n### 六、满减效果监控\n- 每档满减的触发率（用户用了哪档最多）\n- 凑单率（有多少订单是因为凑满减多加菜的）\n- 满减后的实际毛利率（是否还在盈利区间）\n- 不同时段的满减效果（午市vs晚市）' },
      { icon: '⭐', title: '评价管理体系', desc: '差评处理与好评引导', content: '## 评价管理体系\n\n### 一、评价对店铺的影响\n- 评分每降低0.1分，流量下降约15%\n- 一条差评需要8-10条好评才能抵消\n- 近30天评价权重最高\n- 评价回复率影响店铺排序权重\n- 带图/视频的评价权重是纯文字评价的3倍\n\n**评分与流量的关系**：\n| 评分 | 流量影响 | 广告权重 |\n|------|----------|----------|\n| 4.9-5.0 | 基准+20% | 最高优先级 |\n| 4.7-4.8 | 基准 | 正常 |\n| 4.5-4.6 | 基准-15% | 降低 |\n| 4.3-4.4 | 基准-30% | 限制投放 |\n| <4.3 | 基准-50% | 禁止投放 |\n\n### 二、好评引导策略\n1. **菜品层面**：出品稳定、包装精美、附赠小卡片\n   - 出品稳定性：每次份量误差控制在5%以内\n   - 包装升级：使用带品牌Logo的定制包装，提升好感\n   - 赠品策略：随餐附赠小菜/饮料，超出预期\n2. **服务层面**：出餐及时、骑手友好、回复及时\n   - 出餐时间标注留有余量（标15分钟，实际12分钟完成）\n   - 特殊备注（如不要辣）务必严格执行\n   - 骑手到店后2分钟内交接\n3. **引导方式**：\n   - 包装内放置好评卡（非强制引导）\n   - 评价后返1-2元红包（通过平台功能）\n   - 老客专属好评活动（如"晒图送菜"）\n   - 新品试吃邀请老客评价\n\n### 三、差评处理SOP\n1. **30分钟内**回复差评（越快越好）\n   - 使用评价提醒功能，收到差评立即短信通知\n   - 准备5-8套回复模板，根据情况选用\n2. **态度真诚**，先道歉再解释\n   - 模板：「非常抱歉给您带来不好的体验，我们非常重视您的反馈...」\n   - 不要辩解、不要推卸责任、不要质疑用户\n3. **提供解决方案**：补发/退款/优惠券\n   - 口味问题：全额退款+下次免单券\n   - 份量问题：补发一份+道歉\n   - 配送问题：优惠券补偿（非商家责任也要安抚）\n4. **线下跟进**：电话沟通，争取修改评价\n   - 通话态度诚恳，不要施加压力\n   - 修改后额外赠送优惠券表示感谢\n\n### 四、常见差评类型及应对\n| 类型 | 占比 | 应对策略 | 回复模板 |\n|------|------|----------|----------|\n| 口味不佳 | 35% | 道歉+退款+改进备注 | "非常抱歉，我们会加强出品把控..." |\n| 份量不足 | 25% | 说明标准+补发 | "我们的标准份量是XX克，可能..." |\n| 配送慢 | 20% | 解释原因+优惠券 | "配送延迟让您久等了..." |\n| 包装问题 | 12% | 升级包装+致歉 | "包装问题我们已升级为..." |\n| 态度差 | 5% | 核查+培训 | "已核实并培训相关员工..." |\n| 其他 | 3% | 具体问题具体处理 | 灵活应对 |\n\n### 五、差评预防\n- 订单备注100%执行，出错率降为0\n- 高峰期增加人手，避免出餐延迟\n- 定期更新菜品图片，避免"图片仅供参考"争议\n- 包装反复测试，确保运输途中不撒漏\n- 主动设置"免辣选项"等常见备注选项' },
      { icon: '🏷️', title: '平台活动报名指南', desc: '大促活动参与全攻略', content: '## 平台活动报名指南\n\n### 一、活动类型\n1. **日常活动**：天天立减、品牌日、品类日\n   - 报名门槛低，几乎无审核周期\n   - 流量增量约10-30%\n   - 建议每天都参与至少1个日常活动\n2. **节日大促**：春节、520、双11、年终盛典\n   - 需提前7-15天报名\n   - 流量增量可达200-500%\n   - 需要提前备货和人手\n3. **平台专属**：美团神券节、饿了么超级星期五\n   - 每月1-2次，节奏固定\n   - 参与商家可获得首页资源位\n   - 当天订单量通常翻2-3倍\n4. **新店扶持**：新店7天流量包、新客立减\n   - 仅限入驻后30天内的新店\n   - 流量包可带来日均500-2000次曝光\n\n### 二、报名流程\n1. 关注商家后台活动通知（设置消息提醒）\n2. 评估活动ROI（预期投入/预期增量）\n   - ROI = (活动增量利润 - 活动投入) / 活动投入\n   - ROI ≥ 1.5 才值得参与\n3. 准备活动菜品和库存\n   - 爆品备货量 = 日常量 × 2-3倍\n4. 设置活动价和满减\n   - 活动价在原价基础上打7-8折\n5. 提前1-3天报名\n   - 热门活动名额有限，先到先得\n\n### 三、活动策略\n- **引流款**：1-2款超低价爆品，不赚钱赚流量\n  - 定价策略：食材成本价或略低\n  - 目标：拉新+提升店铺人气\n  - 注意：设置限量，避免亏损过大\n- **利润款**：2-3款正常利润菜品\n  - 活动期间保持正常定价\n  - 毛利率保持在40%以上\n- **搭配款**：套餐组合，提高客单价\n  - 主菜+小食+饮料套餐\n  - 套餐价 = 单点总价 × 0.85\n\n### 四、活动后复盘\n- 活动期间vs日常：订单量、客单价、利润对比\n- 活动用户留存率：7天复购率\n  - 留存率>20%：活动质量高\n  - 留存率<10%：用户质量差，下次调整\n- 下次活动优化方向\n\n### 五、活动注意事项\n- ❌ 不要所有菜品都参与活动\n- ❌ 不要设置过多满减叠加\n- ✅ 活动前检查库存和人员准备\n- ✅ 活动期间实时监控数据\n- ✅ 活动后3天内做好用户留存' }
    ]
  },

      { icon: '🏭', title: '中央厨房建设指南', desc: '标准化与成本控制', content: '## 中央厨房建设指南\n\n### 一、适用场景\n- 连锁3家以上门店\n- 日订单量>200单/店\n- 需要标准化出品的品牌\n- 年营收目标>500万\n\n**是否需要中央厨房的判断标准**：\n- 出品一致性差评率>10% = 急需\n- 3家以上门店，食材采购分散 = 建议建\n- 品牌计划1年内开5家店 = 提前规划\n\n### 二、建设步骤\n1. 选址：靠近商圈中心，配送半径≤5公里\n2. 厂房：200-500㎡标准食品加工车间\n3. 设备：炒菜机/蒸柜/冷库/包装线\n4. 资质：食品经营许可证+SC认证\n\n### 三、成本分析\n| 项目 | 投入 | 月均摊 |\n|------|------|--------|\n| 厂房租金 | 3-8万/月 | - |\n| 设备投入 | 30-80万 | 1-3万 |\n| 人工成本 | - | 3-6万 |\n| 食材采购 | - | 按量浮动 |\n\n### 四、效益评估\n- 食材成本降低15-25%（集中采购）\n- 人工成本降低30%（标准化操作）\n- 出品一致性提升，差评率下降40%\n- 6-12个月可回本' },
      { icon: '🚚', title: '冷链物流管理', desc: '食品安全与配送效率', content: '## 冷链物流管理\n\n### 一、冷链标准\n- 冷冻品：-18°C以下\n- 冷藏品：0-4°C\n- 常温品：10-25°C\n- 全程温度监控，每15分钟记录一次\n\n**温度违规的后果**：\n| 偏差 | 影响 | 处理方式 |\n|------|------|----------|\n| 正负2度以内 | 轻微 | 记录并关注 |\n| 正负5度 | 中等 | 立即排查原因 |\n| 大于正负5度 | 严重 | 停止配送+报废处理 |\n\n### 二、配送管理\n1. **路径规划**：使用配送系统优化路线，减少折返\n2. **时效控制**：冷链品30分钟内送达\n3. **包装标准**：保温箱+冰袋+温度显示标签\n4. **异常处理**：温度异常立即告警+启动应急预案\n\n### 三、成本优化\n- 统一采购保温箱（可循环使用，单次成本低）\n- 优化配送路线，减少空驶率\n- 批量配送时段规划（非高峰期预配送）\n\n**冷链设备清单**：\n| 设备 | 用途 | 月成本 |\n|------|------|--------|\n| 冷库(5平米) | 冷冻/冷藏储存 | 800-1500元 |\n| 保温箱(50个) | 配送保温 | 3-5元/次 |\n| 冰袋(200个) | 配送制冷 | 1-2元/次 |\n| 温度记录仪 | 温度监控 | 200-500元/台 |\n\n### 四、食安合规\n- 从业人员健康证100%覆盖\n- 每日温度记录存档\n- 每周设备维护检查\n- 每月第三方食安检测' },
      { icon: '📋', title: '食材采购成本优化', desc: '供应链降本增效方法', content: '## 食材采购成本优化\n\n### 一、采购策略\n1. **集中采购**：多店统一采购，降低单价10-20%\n2. **季节性采购**：应季食材成本低30-50%\n3. **长期合同**：签订季度合同锁定价格\n4. **多供应商比价**：至少3家供应商轮换\n\n### 二、成本控制方法\n| 方法 | 降幅 | 难度 |\n|------|------|------|\n| 集中采购 | 10-20% | 低 |\n| 季节性选品 | 30-50% | 中 |\n| 减少损耗 | 5-15% | 中 |\n| 替代食材 | 10-30% | 高 |\n\n### 三、损耗管理\n- 建立出入库台账，每日盘点\n- 先进先出（FIFO）原则\n- 临近保质期食材优先使用或做促销\n- 损耗率目标：≤5%\n\n### 四、数字化工具\n- 采购管理系统：自动比价+库存预警\n- 供应商评分：品质/价格/配送评分\n- 成本看板：实时监控食材成本占比' },
      { icon: '🔬', title: '菜品标准化SOP', desc: '口味一致性与出品速度', content: '## 菜品标准化SOP\n\n### 一、SOP编写原则\n1. **量化**：所有材料精确到克\n2. **可视化**：配图+视频辅助理解\n3. **可复制**：新手也能在3次练习内掌握\n4. **可追溯**：每一步都有检查标准\n\n### 二、标准SOP模板\n```\n菜品名：XXX\n出品时间：XX分钟\n食材清单：\n  - 主料：XX克\n  - 辅料：XX克\n  - 调料：XX克\n\n制作步骤：\n1. 备料：XXX（附图）\n2. 热锅：油温XX度\n3. 下料：先放XX，翻炒XX秒\n4. 调味：加入XX调料\n5. 出锅：色泽/气味标准（附图）\n\n质检标准：\n- 份量：XX克±5%\n- 色泽：XXX\n- 口感：XXX\n```' }
    ]

  {

      { icon: '📉', title: '外卖数据看板搭建', desc: '核心指标体系与可视化', content: '## 外卖数据看板搭建\n\n### 一、核心指标体系\n| 维度 | 指标 | 计算方式 |\n|------|------|----------|\n| 流量 | 曝光量 | 店铺展示次数 |\n| 流量 | 进店率 | 进店数/曝光数 |\n| 转化 | 下单率 | 下单数/进店数 |\n| 收入 | 客单价 | 营收/订单数 |\n| 收入 | 毛利率 | 毛利/营收 |\n| 留存 | 复购率 | 复购用户/总用户 |\n| 服务 | 评分 | 近30天平均 |\n| 效率 | 出餐时长 | 平均出餐分钟数 |\n\n### 二、看板搭建工具\n1. **Excel**：适合单店，数据量小\n2. **Google Sheets**：多人协作，自动更新\n3. **BI工具**（推荐）：PowerBI/Tableau/帆软\n\n### 三、数据更新频率\n- 实时数据：订单量、营收（每小时）\n- 日常数据：评分、转化率（每日）\n- 周期数据：复购率、用户画像（每周/月）\n\n### 四、看板设计原则\n- 一屏看清核心指标\n- 趋势图优于数字表\n- 红绿标识异常值\n- 支持下钻查看明细\n\n### 五、看板搭建实操步骤\n1. 确定核心指标（参考上表，选择8-12个核心指标）\n2. 数据采集：从平台后台导出数据，或使用API对接\n3. 数据清洗：去除异常值（如退款订单、测试订单）\n4. 建立数据模型：计算各指标的日/周/月趋势\n5. 可视化设计：选择合适的图表类型\n   - 趋势类指标用折线图\n   - 占比类指标用饼图/环形图\n   - 对比类指标用柱状图\n6. 设置告警规则：关键指标异常时自动通知\n\n**常用告警规则**：\n| 指标 | 告警条件 | 通知方式 |\n|------|----------|----------|\n| 评分 | 下降0.2分 | 短信+微信 |\n| 日订单量 | 下降30% | 微信通知 |\n| 差评数 | 当日>3条 | 立即短信 |\n| 出餐时长 | >20分钟 | 微信通知 |' },
      { icon: '🎯', title: '用户画像分析方法', desc: '精准营销与复购提升', content: '## 用户画像分析方法\n\n### 一、画像维度\n1. **基础属性**：性别、年龄、职业\n2. **消费属性**：客单价、下单频次、品类偏好\n3. **时间属性**：下单时段、工作日/周末偏好\n4. **行为属性**：搜索习惯、浏览路径、评价习惯\n\n### 二、用户分层\n| 层级 | 定义 | 运营策略 |\n|------|------|----------|\n| 高价值 | 月下单≥4次+客单价≥均值 | VIP专属优惠+新品优先 |\n| 活跃 | 月下单2-3次 | 满减引导提频 |\n| 沉默 | 30天未下单 | 唤醒红包+推送 |\n| 流失 | 60天未下单 | 大额召回券 |\n| 新客 | 首次下单 | 新客礼包+引导复购 |\n\n### 三、数据获取方式\n- 平台商家后台：用户分析模块\n- 订单数据导出分析\n- 第三方工具：神策、GrowingIO\n\n### 四、应用场景\n- 精准推送：根据用户偏好推荐菜品\n- 差异化定价：不同用户群体不同优惠\n- 选品决策：根据用户口味偏好调整菜单\n\n### 五、用户画像实操案例\n\n**案例1：某川菜馆用户画像分析**\n- 核心用户：25-35岁白领，客单价35-45元\n- 下单时段：午市占60%，晚市占35%，夜宵5%\n- 口味偏好：麻辣占45%，微辣占35%，不辣占20%\n- 复购周期：平均12天复购1次\n\n**运营调整**：\n1. 午市推出35元套餐，覆盖核心客单价\n2. 增加"微辣""不辣"选项，覆盖80%用户\n3. 12天未复购用户推送5元红包\n4. 结果：复购率从18%提升至26%\n\n**案例2：某轻食店用户画像**\n- 核心用户：女性占比72%，18-30岁，健身人群\n- 客单价：40-55元，高于品类均值20%\n- 下时段：11:00-12:30占45%\n- 复购频次：月均2.3次\n\n**运营调整**：\n1. 推出"健身周卡"：5餐199元\n2. 增加蛋白质加量选项（+5元）\n3. 结果：客单价提升15%，复购率提升22%' },
      { icon: '🗺️', title: '商圈分析工具使用', desc: '选址与竞争分析', content: '## 商圈分析工具使用\n\n### 一、分析维度\n1. **人口密度**：3公里内常住人口/工作人口\n2. **消费能力**：周边小区房价、写字楼等级\n3. **竞争态势**：同品类商家数量、评分分布\n4. **外卖需求**：品类搜索热度、下单频次\n5. **配送条件**：道路状况、骑手密度\n\n### 二、分析工具\n- **美团/饿了么商家版**：商圈数据模块\n- **高德/百度地图**：热力图+POI数据\n- **天眼查**：竞品工商信息\n- **大众点评**：竞品评价分析\n\n### 三、选址评分模型\n```\n选址评分 = \n  人口密度分 × 25% +\n  消费能力分 × 20% +\n  竞争压力分 × 20% +\n  外卖需求分 × 25% +\n  配送条件分 × 10%\n\n评分≥80：优秀选址\n评分60-80：良好选址  \n评分<60：需谨慎\n```' },
      { icon: '📊', title: 'ROI计算与优化', desc: '投入产出比分析方法', content: '## ROI计算与优化\n\n### 一、ROI基础公式\n**ROI = (收入 - 成本) / 成本 × 100%**\n\n### 二、外卖ROI计算\n| 投入项 | 说明 |\n|--------|------|\n| 推广费用 | 搜索推广+信息流 |\n| 满减让利 | 满减金额 × 订单数 |\n| 活动投入 | 平台活动+品牌活动 |\n| 包装成本 | 打包盒+保温袋 |\n\n**到手ROI = (活动期间毛利 - 日常毛利) / 活动额外投入**\n\n### 三、ROI优化策略\n1. **降低获客成本**：优化推广关键词，提高点击率\n2. **提升客单价**：满减引导+套餐组合\n3. **提高复购率**：会员体系+精准召回\n4. **控制活动成本**：精细化满减档位设置\n\n### 四、ROI基准\n| 活动 | 合格ROI | 优秀ROI |\n|------|---------|--------|\n| 搜索推广 | ≥2.0 | ≥4.0 |\n| 满减活动 | ≥1.5 | ≥3.0 |\n| 品牌日 | ≥1.2 | ≥2.5 |\n\n### 五、ROI计算实操案例\n\n**案例：某快餐店搜索推广ROI分析**\n\n**投入**：\n- 搜索推广费：3000元/月\n- 平均CPC：0.8元/点击\n- 点击量：3750次\n\n**产出**：\n- 进店转化率：15%（563人进店）\n- 下单转化率：25%（141单）\n- 客单价：32元\n- 营收：4512元\n- 毛利率：45%（毛利2030元）\n\n**ROI = (2030 - 3000) / 3000 = -0.32**\n\n→ ROI为负！需要优化\n\n**优化方案**：\n1. 优化关键词，提升点击率（CPC降到0.5）\n2. 优化店铺头图，提升进店率（15%→25%）\n3. 优化满减设置，提升下单率（25%→35%）\n\n**优化后**：\n- 点击量：6000次（同预算，CPC降低）\n- 进店：1500人\n- 下单：525单\n- 营收：16800元\n- 毛利：7560元\n\n**优化后ROI = (7560 - 3000) / 3000 = 1.52**\n\n→ 达到合格线' },
      { icon: '🔮', title: '销售预测模型', desc: '备货与排班数据支撑', content: '## 销售预测模型\n\n### 一、影响预测的因素\n1. **时间因素**：工作日/周末/节假日/季节\n2. **天气因素**：雨天外卖量+20-30%\n3. **活动因素**：平台大促日单量翻倍\n4. **趋势因素**：整体增长/下滑趋势\n\n### 二、简单预测方法\n**移动平均法**：\n预测值 = 前7天日均订单量 × (1+增长率)\n\n**示例**：\n- 前7天日均：200单\n- 月增长率：5%\n- 明日预测：200 × 1.05 = 210单\n\n### 三、备货建议\n| 预测订单量 | 备货倍数 | 说明 |\n|------------|----------|------|\n| <100单 | 1.2倍 | 少量备货 |\n| 100-300单 | 1.3倍 | 标准备货 |\n| 300-500单 | 1.4倍 | 适当多备 |\n| >500单 | 1.5倍 | 大促备货 |\n\n### 四、排班建议\n- 根据预测单量安排人员\n- 高峰期（11-13点、17-19点）增加人手\n- 大促日提前1小时到岗\n\n### 五、预测模型进阶\n\n**加权移动平均法**（更精准）：\n预测值 = 近7天订单量加权平均\n权重分配：最近1天(30%) + 前2-3天(30%) + 前4-7天(25%) + 历史同期(15%)\n\n**考虑天气因素**：\n| 天气 | 订单量影响 | 调整系数 |\n|------|------------|----------|\n| 晴天 | 基准 | 1.0 |\n| 多云 | 基准+5% | 1.05 |\n| 小雨 | 基准+20% | 1.2 |\n| 大雨 | 基准+35% | 1.35 |\n| 极端天气 | 基准+50% | 1.5 |\n\n**考虑节假日因素**：\n- 工作日午市订单占比55%，晚市35%，夜宵10%\n- 周末午市订单占比35%，晚市40%，夜宵25%\n- 节假日整体订单量增加30-50%\n\n### 六、备货实操清单\n\n**每日备货检查清单**：\n1. 查看明日天气预报\n2. 确认是否有平台活动\n3. 对比上周同日订单量\n4. 计算明日各品类预计需求量\n5. 检查库存是否充足\n6. 确认人员排班是否到位' }
    ]

  {

      { icon: '📜', title: '外卖食品安全法规', desc: '食安合规要点解读', content: '## 外卖食品安全法规\n\n### 一、核心法规\n1. 《中华人民共和国食品安全法》\n2. 《网络餐饮服务食品安全监督管理办法》\n3. 《外卖配送包装规范》\n4. 《餐饮服务食品安全操作规范》\n\n### 二、商家合规要点\n| 要点 | 要求 | 违规后果 |\n|------|------|----------|\n| 证照齐全 | 营业执照+食品经营许可证 | 下架+罚款 |\n| 实体门店 | 必须有线下实体店 | 不予入驻 |\n| 食材来源 | 可追溯，索证索票 | 罚款3-5万 |\n| 加工规范 | 生熟分开、温度达标 | 停业整顿 |\n| 包装要求 | 食品级包装+封签 | 警告+罚款 |\n\n### 三、食安检查重点\n1. 证照是否在有效期\n2. 从业人员健康证\n3. 食材采购台账\n4. 加工区域卫生状况\n5. 冷藏冷冻设备温度\n6. 外卖封签使用情况\n\n### 四、违规处罚\n- 轻微违规：警告+限期整改\n- 一般违规：罚款1-5万元\n- 严重违规：停业+吊销许可证+追究刑事责任\n\n### 五、食安自查清单（每周必检）\n\n**环境检查**：\n- [ ] 操作台面是否清洁消毒\n- [ ] 地面是否干燥无积水\n- [ ] 垃圾桶是否加盖并及时清理\n- [ ] 排烟设备是否正常运转\n\n**设备检查**：\n- [ ] 冷藏柜温度0-4度\n- [ ] 冷冻柜温度低于-18度\n- [ ] 消毒柜正常运转\n- [ ] 温度记录仪正常记录\n\n**人员检查**：\n- [ ] 所有人员健康证在有效期内\n- [ ] 工作服/帽子/口罩佩戴规范\n- [ ] 手部清洁（洗手→消毒→烘干）\n- [ ] 无人带病上岗\n\n**食材检查**：\n- [ ] 采购台账完整可追溯\n- [ ] 食材在保质期内\n- [ ] 生熟分开存放\n- [ ] 先进先出原则执行\n\n### 六、外卖封签规范\n- 封签必须完整覆盖包装开口\n- 封签上需印制商家名称\n- 封签一旦破损，用户有权拒收\n- 建议使用一次性防拆封签' },

// ===== RENDER FUNCTIONS =====

function renderNews() {
  const list = document.getElementById('newsList');
  list.innerHTML = newsData.map((n, i) => `
    <div class="news-card" onclick="openArticle(${i})">
      <div class="news-card-header">
        <span class="news-source ${n.sourceClass}">${n.source}</span>
        <span class="news-time">${n.time}</span>
      </div>
      <div class="news-title">${n.title}</div>
      <div class="news-summary">${n.summary}</div>
      <div class="news-tags">
        ${n.tags.map(t => `<span class="news-tag">${t}</span>`).join('')}
      </div>
    </div>
  `).join('');
}

function openArticle(idx) {
  const n = newsData[idx];
  document.getElementById('articleModalTitle').textContent = n.source + ' · 文章详情';
  document.getElementById('articleModalBody').innerHTML = `
    <div class="article-meta">${n.time} · ${n.tags.join(' / ')}</div>
    <h3 style="font-size:17px;font-weight:700;margin-bottom:14px;line-height:1.6;">${n.title}</h3>
    <div class="article-content">${n.content.split('\n\n').map(p => `<p>${p}</p>`).join('')}</div>
  `;
  document.getElementById('articleModal').classList.add('show');
}

function closeArticleModal() {
  document.getElementById('articleModal').classList.remove('show');
}

function renderKnowledge() {
  const grid = document.getElementById('kbGrid');
  grid.innerHTML = knowledgeData.map((k, i) => `
    <div class="kb-card" onclick="showKbDetail(${i})">
      <div class="kb-icon">${k.icon}</div>
      <div class="kb-name">${k.name}</div>
      <div class="kb-count">${k.count} 个条目</div>
    </div>
  `).join('');
}

            <div class="kb-item-desc">${item.desc}</div>
          </div>
          <span class="kb-item-arrow">›</span>
        </div>
      `).join('')}
    </div>
  `;
}

function hideKbDetail() {
  document.getElementById('kbGrid').style.display = '';
  document.getElementById('kbDetail').style.display = 'none';
}

function openKbItem(catIdx, itemIdx) {
  const item = knowledgeData[catIdx].items[itemIdx];
  document.getElementById('articleModalTitle').textContent = item.title;
  const html = item.content
    .replace(/^## (.+)$/gm, '<h3 style="font-size:17px;font-weight:700;margin:18px 0 10px;color:var(--text);">$1</h3>')
    .replace(/^### (.+)$/gm, '<h4 style="font-size:15px;font-weight:600;margin:14px 0 8px;color:var(--text);">$1</h4>')
    .replace(/^\|(.+)\|$/gm, (match) => {
      const cells = match.split('|').filter(c => c.trim());
      if (cells.every(c => /^[\s-:]+$/.test(c))) return '';
      const isHeader = match.includes('---');
      if (isHeader) return '';
      return '<tr>' + cells.map(c => `<td style="padding:6px 10px;border:1px solid var(--border);font-size:13px;">${c.trim()}</td>`).join('') + '</tr>';
    })
    .replace(/^(\d+)\.\s+(.+)$/gm, '<div style="padding:4px 0 4px 16px;font-size:14px;line-height:1.7;"><strong>$1.</strong> $2</div>')
    .replace(/^-\s+(.+)$/gm, '<div style="padding:2px 0 2px 16px;font-size:14px;line-height:1.7;">• $1</div>')
    .replace(/```([\s\S]*?)```/g, '<pre style="background:#f5f5f5;padding:14px;border-radius:8px;font-size:13px;overflow-x:auto;line-height:1.6;margin:10px 0;">$1</pre>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n{2,}/g, '<br>');
  // Wrap tables
  const finalHtml = html.replace(/(<tr>.*?<\/tr>(\s*<tr>.*?<\/tr>)*)/gs, '<table style="width:100%;border-collapse:collapse;margin:10px 0;">$1</table>');
  document.getElementById('articleModalBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);">
      <span style="font-size:24px;">${item.icon}</span>
      <div>
        <div style="font-size:14px;color:var(--text-secondary);">${item.desc}</div>
      </div>
    </div>
    <div class="article-content">${finalHtml}</div>
  `;
  document.getElementById('articleModal').classList.add('show');
}

function renderQuiz() {
  const list = document.getElementById('quizList');
  list.innerHTML = quizData.map((q, i) => `
    <div class="quiz-card" onclick="startQuiz(${i})">
      <div class="quiz-card-top">
        <span class="quiz-emoji">${q.emoji}</span>
        <div class="quiz-info">
          <div class="quiz-name">${q.name}</div>
          <div class="quiz-desc">${q.desc}</div>
        </div>
      </div>
      <div class="quiz-progress-bar">
        <div class="quiz-progress-fill" style="width:${q.progress}%"></div>
      </div>
      <div class="quiz-meta">
        <span>进度 ${q.progress}%</span>
        <span>${q.total} 题</span>
      </div>
    </div>
  `).join('');
}

// ===== QUIZ LOGIC =====
let currentQuiz = null;
let currentQuestion = 0;
let correctCount = 0;
let answered = false;

function startQuiz(idx) {
  currentQuiz = idx;
  currentQuestion = 0;
  correctCount = 0;
  answered = false;
  document.getElementById('quizModalTitle').textContent = quizData[idx].name;
  renderQuestion();
  document.getElementById('quizModal').classList.add('show');
}

function renderQuestion() {
  const q = quizData[currentQuiz];
  const qItem = q.questions[currentQuestion];
  answered = false;
  document.getElementById('quizModalBody').innerHTML = `
    <div style="font-size:13px;color:#999;margin-bottom:8px;">第 ${currentQuestion+1}/${q.total} 题</div>
    <div class="quiz-question">${qItem.q}</div>
    <div class="quiz-options">
      ${qItem.options.map((opt, i) => `
        <button class="quiz-option" data-idx="${i}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${opt}</button>
      `).join('')}
    </div>
  `;
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = quizData[currentQuiz].questions[currentQuestion];
  const options = document.querySelectorAll('.quiz-option');
  options.forEach((opt, i) => {
    if (i === q.answer) opt.classList.add('correct');
    if (i === idx && i !== q.answer) opt.classList.add('wrong');
  });
  if (idx === q.answer) correctCount++;
  setTimeout(() => {
    currentQuestion++;
    if (currentQuestion < quizData[currentQuiz].questions.length) {
      renderQuestion();
    } else {
      showQuizResult();
    }
  }, 1200);
}

function showQuizResult() {
  const q = quizData[currentQuiz];
  const score = Math.round(correctCount / q.total * 100);
  const emoji = score >= 80 ? '🎉' : score >= 60 ? '👍' : '💪';
  document.getElementById('quizModalBody').innerHTML = `
    <div class="quiz-result">
      <div class="quiz-result-icon">${emoji}</div>
      <div class="quiz-result-text">答题完成！</div>
      <div class="quiz-result-score">${score}分</div>
      <div style="font-size:14px;color:#666;margin-bottom:8px;">正确 ${correctCount}/${q.total} 题</div>
      <button class="quiz-btn" onclick="startQuiz(${currentQuiz})">重新挑战</button>
    </div>
  `;
}

function closeQuizModal() {
  document.getElementById('quizModal').classList.remove('show');
}

// ===== TAB SWITCHING =====
document.querySelectorAll('.tab-btn, .nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
  });
});

// ===== REFRESH =====
function refreshNews() {
  document.getElementById('lastRefresh').textContent = '刚刚';
  // Simulate new data count
  const count = 128 + Math.floor(Math.random() * 20);
  document.getElementById('newsCount').textContent = count;
}

// Auto refresh time
setInterval(() => {
  const el = document.getElementById('lastRefresh');
  if (el.textContent === '刚刚') el.textContent = '1分钟前';
  else {
    const m = parseInt(el.textContent) || 1;
    el.textContent = (m+1) + '分钟前';
  }
}, 60000);

// ===== INIT =====
renderNews();
renderKnowledge();
renderQuiz();
</script>
