<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>外卖分析师工作平台</title>
  <style>
    :root {
      --primary: #E2382E;
      --primary-dark: #C42A22;
      --primary-light: #FF6B5E;
      --accent: #FF9800;
      --bg: #F5F6FA;
      --card: #FFFFFF;
      --text: #1A1A2E;
      --text-secondary: #6B7280;
      --border: #E5E7EB;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
      --radius: 16px;
      --radius-sm: 10px;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    /* ===== Header ===== */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #fff;
      padding: 20px 24px 60px;
      position: relative;
      overflow: hidden;
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -40px;
      left: 0; right: 0;
      height: 80px;
      background: var(--bg);
      border-radius: 50% 50% 0 0;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .jd-dog {
      width: 48px;
      height: 48px;
      background: #fff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      overflow: hidden;
      padding: 0;
    }
    .jd-dog img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .app-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .app-subtitle {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 2px;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .header-btn {
      background: rgba(255,255,255,0.2);
      border: none;
      color: #fff;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.2s;
    }
    .header-btn:hover { background: rgba(255,255,255,0.35); }
    /* ===== Stats Bar ===== */
    .stats-bar {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      padding: 0 4px;
    }
    .stat-item {
      flex: 1;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
    }
    .stat-value { font-size: 22px; font-weight: 700; }
    .stat-label { font-size: 11px; opacity: 0.8; margin-top: 2px; }

    /* ===== Main Content ===== */
    .main {
      padding: 0 16px 90px;
      margin-top: -30px;
      position: relative;
      z-index: 1;
    }

    /* ===== Tab Navigation ===== */
    .tab-nav {
      display: flex;
      background: var(--card);
      border-radius: 14px;
      padding: 5px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(226,56,46,0.3);
    }
    .tab-btn:not(.active):hover { background: #f3f4f6; }

    /* ===== Tab Content ===== */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ===== Section Title ===== */
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title .icon { font-size: 20px; }

    /* ===== News Cards ===== */
    .news-list { display: flex; flex-direction: column; gap: 12px; }
    .news-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .news-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .news-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .news-source {
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      color: #fff;
    }
    .source-hongcan { background: #E53935; }
    .source-toutiao { background: #F44336; }
    .source-36kr { background: #009688; }
    .source-ifeng { background: #FF6F00; }
    .source-waimai { background: var(--primary); }
    .source-keji { background: #1976D2; }
    .news-time { font-size: 12px; color: var(--text-secondary); }
    .news-title { font-size: 15px; font-weight: 600; line-height: 1.5; margin-bottom: 6px; }
    .news-summary { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
    .news-tags { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
    .news-tag {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: #FEF2F2;
      color: var(--primary);
    }

    /* ===== Knowledge Base ===== */
    .kb-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .kb-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px 16px;
      box-shadow: var(--shadow);
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .kb-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
    .kb-icon { font-size: 36px; margin-bottom: 10px; }
    .kb-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .kb-count { font-size: 12px; color: var(--text-secondary); }

    .kb-detail {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-top: 14px;
    }
    .kb-detail-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .kb-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #f3f4f6;
      cursor: pointer;
    }
    .kb-item:last-child { border-bottom: none; }
    .kb-item:hover { background: #fafafa; }
    .kb-item-icon { font-size: 20px; }
    .kb-item-text { flex: 1; }
    .kb-item-title { font-size: 14px; font-weight: 500; }
    .kb-item-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .kb-item-arrow { color: #ccc; font-size: 14px; }

    /* ===== Quiz Section ===== */
    .quiz-categories { display: flex; flex-direction: column; gap: 12px; }
    .quiz-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: transform 0.2s;
    }
    .quiz-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .quiz-card-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .quiz-emoji { font-size: 32px; }
    .quiz-info { flex: 1; }
    .quiz-name { font-size: 15px; font-weight: 600; }
    .quiz-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .quiz-progress-bar {
      height: 6px;
      background: #eee;
      border-radius: 3px;
      overflow: hidden;
    }
    .quiz-progress-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width 0.5s;
    }
    .quiz-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* ===== Quiz Modal ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      top:0;left:0;right:0;bottom:0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: #fff;
      border-radius: var(--radius);
      width: 100%;
      max-width: 500px;
      max-height: 80vh;
      overflow-y: auto;
      padding: 24px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-title { font-size: 18px; font-weight: 700; }
    .modal-close {
      border: none;
      background: #f3f4f6;
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
    }
    .quiz-question {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .quiz-options { display: flex; flex-direction: column; gap: 10px; }
    .quiz-option {
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      background: #fff;
      text-align: left;
    }
    .quiz-option:hover { border-color: var(--primary-light); background: #FFF5F5; }
    .quiz-option.correct { border-color: #4CAF50; background: #E8F5E9; }
    .quiz-option.wrong { border-color: #F44336; background: #FFEBEE; }
    .quiz-option.selected { border-color: var(--primary); background: #FFF5F5; }
    .quiz-result {
      text-align: center;
      padding: 20px;
    }
    .quiz-result-icon { font-size: 48px; margin-bottom: 12px; }
    .quiz-result-text { font-size: 16px; font-weight: 600; }
    .quiz-result-score { font-size: 36px; font-weight: 700; color: var(--primary); margin: 10px 0; }
    .quiz-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
    .quiz-btn:hover { background: var(--primary-dark); }

    /* ===== Article Modal ===== */
    .article-content { line-height: 1.8; font-size: 14px; color: #333; }
    .article-content p { margin-bottom: 12px; }
    .article-meta { font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }

    /* ===== Bottom Navigation ===== */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0; right: 0;
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex;
      padding: 8px 0;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 6px;
      border: none;
      background: none;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 11px;
      transition: color 0.2s;
    }
    .nav-item.active { color: var(--primary); }
    .nav-item .nav-icon { font-size: 22px; }
    .nav-item .nav-icon svg { width: 24px; height: 24px; }
    .nav-item .nav-icon svg path,
    .nav-item .nav-icon svg circle,
    .nav-item .nav-icon svg rect,
    .nav-item .nav-icon svg line,
    .nav-item .nav-icon svg polyline {
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item .nav-icon svg .filled { fill: currentColor; }

    /* ===== Refresh indicator ===== */
    .refresh-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px;
      margin-bottom: 14px;
      font-size: 12px;
      color: var(--text-secondary);
      background: var(--card);
      border-radius: 10px;
    }
    .refresh-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4CAF50;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* ===== Scrollbar ===== */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }

    /* ===== Responsive ===== */
    @media (min-width: 600px) {
      .main { max-width: 540px; margin-left: auto; margin-right: auto; }
    }
  </style>
</head>

<script>
// ===== DATA =====
// ===== REAL NEWS: fetch from RSS feeds via rss2json (parallel) =====
const RSS_SOURCES = [
  { name: '36氪', rss: 'https://36kr.com/feed', className: 'source-36kr' },
  { name: '爱范儿', rss: 'https://www.ifanr.com/feed', className: 'source-ifanr' },
  { name: 'IT之家', rss: 'https://www.ithome.com/rss/', className: 'source-ithome' },
  { name: '少数派', rss: 'https://feeds.feedburner.com/playpcesor', className: 'source-sspai' }
];

async function fetchNews() {
  const API = 'https://api.rss2json.com/v1/api.json?rss_url=';
  const allNews = [];

  // Fetch all feeds in parallel for speed
  const results = await Promise.allSettled(
    RSS_SOURCES.map(src =>
      fetch(API + encodeURIComponent(src.rss), { signal: AbortSignal.timeout(6000) })
        .then(r => r.json())
        .then(data => {
          if (data.status !== 'ok' || !data.items) return [];
          return data.items.slice(0, 4).map(item => ({
            source: src.name,
            sourceClass: src.className,
            time: formatTime(item.pubDate),
            title: (item.title || '').replace(/<[^>]+>/g, '').trim(),
            summary: (item.description || item.title || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 100),
            url: item.link || '',
            _ts: item.pubDate ? new Date(item.pubDate).getTime() : 0
          }));
        })
        .catch(() => [])
    )
  );

  for (const r of results) {
    if (r.status === 'fulfilled' && r.value) allNews.push(...r.value);
  }

  allNews.sort((a, b) => (b._ts || 0) - (a._ts || 0));
  return allNews.slice(0, 12);
}

function formatTime(dateStr) {
  try {
    const d = new Date(dateStr);
    if (isNaN(d)) return '近期';
    const diff = (Date.now() - d) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return Math.floor(diff/60) + '分钟前';
    if (diff < 86400) return Math.floor(diff/3600) + '小时前';
    return Math.floor(diff/86400) + '天前';
  } catch(e) { return '近期'; }
}

function extractTags(text) {
  const keywords = ['外卖','美团','饿了么','抖音','科技','AI','政策','餐饮','电商','即时零售','直播','供应链','手机','芯片','苹果'];
  const tags = [];
  for (const kw of keywords) {
    if (text.includes(kw) && tags.length < 2) tags.push(kw);
  }
  if (tags.length === 0) tags.push('行业资讯');
  return tags;
}

async function renderNews() {
  const list = document.getElementById('newsList');
  list.innerHTML = '<div style="text-align:center;padding:40px;color:#999;font-size:14px;">正在获取最新资讯...</div>';

  const newsData = await fetchNews();

  if (newsData.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:#999;font-size:14px;">暂无法获取资讯，请稍后再试<br><button onclick="renderNews()" style="margin-top:12px;padding:8px 20px;border:none;background:var(--primary);color:#fff;border-radius:8px;font-size:13px;cursor:pointer;">重新加载</button></div>';
    return;
  }

  list.innerHTML = newsData.map((n, i) => `
    <div class="news-card" onclick="window.open('${n.url}', '_blank')" style="cursor:pointer;">
      <div class="news-card-header">
        <span class="news-source ${n.sourceClass}">${n.source}</span>
        <span class="news-time">${n.time}</span>
      </div>
      <div class="news-title">${n.title}</div>
      <div class="news-summary">${n.summary}</div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;">
        <div class="news-tags">
          ${extractTags(n.title + ' ' + n.summary).map(t => `<span class="news-tag">${t}</span>`).join('')}
        </div>
        <span style="font-size:12px;color:#999;">查看原文 →</span>
      </div>
    </div>
  `).join('');
}




function renderKnowledge() {
  const grid = document.getElementById('kbGrid');
  grid.innerHTML = knowledgeData.map((k, i) => `
    <div class="kb-card" onclick="showKbDetail(${i})">
      <div class="kb-icon">${k.icon}</div>
      <div class="kb-name">${k.name}</div>
      <div class="kb-count">${k.count} 个条目</div>
    </div>
  `).join('');
}

function showKbDetail(idx) {
  const k = knowledgeData[idx];
  const detail = document.getElementById('kbDetail');
  document.getElementById('kbGrid').style.display = 'none';
  detail.style.display = 'block';
  detail.innerHTML = `
    <div class="kb-detail">
      <div class="kb-detail-title" style="cursor:pointer;" onclick="hideKbDetail()">
        ← 返回 ${k.name}
      </div>
      ${k.items.map((item, i) => `
        <div class="kb-item" onclick="openKbItem(${idx}, ${i})">
          <span class="kb-item-icon">${item.icon}</span>
          <div class="kb-item-text">
            <div class="kb-item-title">${item.title}</div>
            <div class="kb-item-desc">${item.desc}</div>
          </div>
          <span class="kb-item-arrow">›</span>
        </div>
      `).join('')}
    </div>
  `;
}

function hideKbDetail() {
  document.getElementById('kbGrid').style.display = '';
  document.getElementById('kbDetail').style.display = 'none';
}

function openKbItem(catIdx, itemIdx) {
  const item = knowledgeData[catIdx].items[itemIdx];
  document.getElementById('articleModalTitle').textContent = item.title;
  const html = item.content
    .replace(/^## (.+)$/gm, '<h3 style="font-size:17px;font-weight:700;margin:18px 0 10px;color:var(--text);">$1</h3>')
    .replace(/^### (.+)$/gm, '<h4 style="font-size:15px;font-weight:600;margin:14px 0 8px;color:var(--text);">$1</h4>')
    .replace(/^\|(.+)\|$/gm, (match) => {
      const cells = match.split('|').filter(c => c.trim());
      if (cells.every(c => /^[\s-:]+$/.test(c))) return '';
      const isHeader = match.includes('---');
      if (isHeader) return '';
      return '<tr>' + cells.map(c => `<td style="padding:6px 10px;border:1px solid var(--border);font-size:13px;">${c.trim()}</td>`).join('') + '</tr>';
    })
    .replace(/^(\d+)\.\s+(.+)$/gm, '<div style="padding:4px 0 4px 16px;font-size:14px;line-height:1.7;"><strong>$1.</strong> $2</div>')
    .replace(/^-\s+(.+)$/gm, '<div style="padding:2px 0 2px 16px;font-size:14px;line-height:1.7;">• $1</div>')
    .replace(/```([\s\S]*?)```/g, '<pre style="background:#f5f5f5;padding:14px;border-radius:8px;font-size:13px;overflow-x:auto;line-height:1.6;margin:10px 0;">$1</pre>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n{2,}/g, '<br>');
  // Wrap tables
  const finalHtml = html.replace(/(<tr>.*?<\/tr>(\s*<tr>.*?<\/tr>)*)/gs, '<table style="width:100%;border-collapse:collapse;margin:10px 0;">$1</table>');
  document.getElementById('articleModalBody').innerHTML = `
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);">
      <span style="font-size:24px;">${item.icon}</span>
      <div>
        <div style="font-size:14px;color:var(--text-secondary);">${item.desc}</div>
      </div>
    </div>
    <div class="article-content">${finalHtml}</div>
  `;
  document.getElementById('articleModal').classList.add('show');
}

function renderQuiz() {
  const list = document.getElementById('quizList');
  list.innerHTML = quizData.map((q, i) => `
    <div class="quiz-card" onclick="startQuiz(${i})">
      <div class="quiz-card-top">
        <span class="quiz-emoji">${q.emoji}</span>
        <div class="quiz-info">
          <div class="quiz-name">${q.name}</div>
          <div class="quiz-desc">${q.desc}</div>
        </div>
      </div>
      <div class="quiz-progress-bar">
        <div class="quiz-progress-fill" style="width:${q.progress}%"></div>
      </div>
      <div class="quiz-meta">
        <span>进度 ${q.progress}%</span>
        <span>${q.total} 题</span>
      </div>
    </div>
  `).join('');
}

// ===== QUIZ LOGIC =====
let currentQuiz = null;
let currentQuestion = 0;
let correctCount = 0;
let answered = false;

function startQuiz(idx) {
  currentQuiz = idx;
  currentQuestion = 0;
  correctCount = 0;
  answered = false;
  document.getElementById('quizModalTitle').textContent = quizData[idx].name;
  renderQuestion();
  document.getElementById('quizModal').classList.add('show');
}

function renderQuestion() {
  const q = quizData[currentQuiz];
  const qItem = q.questions[currentQuestion];
  answered = false;
  document.getElementById('quizModalBody').innerHTML = `
    <div style="font-size:13px;color:#999;margin-bottom:8px;">第 ${currentQuestion+1}/${q.total} 题</div>
    <div class="quiz-question">${qItem.q}</div>
    <div class="quiz-options">
      ${qItem.options.map((opt, i) => `
        <button class="quiz-option" data-idx="${i}" onclick="selectAnswer(${i})">${String.fromCharCode(65+i)}. ${opt}</button>
      `).join('')}
    </div>
  `;
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = quizData[currentQuiz].questions[currentQuestion];
  const options = document.querySelectorAll('.quiz-option');
  options.forEach((opt, i) => {
    if (i === q.answer) opt.classList.add('correct');
    if (i === idx && i !== q.answer) opt.classList.add('wrong');
  });
  if (idx === q.answer) correctCount++;
  setTimeout(() => {
    currentQuestion++;
    if (currentQuestion < quizData[currentQuiz].questions.length) {
      renderQuestion();
    } else {
      showQuizResult();
    }
  }, 1200);
}

function showQuizResult() {
  const q = quizData[currentQuiz];
  const score = Math.round(correctCount / q.total * 100);
  const emoji = score >= 80 ? '🎉' : score >= 60 ? '👍' : '💪';
  document.getElementById('quizModalBody').innerHTML = `
    <div class="quiz-result">
      <div class="quiz-result-icon">${emoji}</div>
      <div class="quiz-result-text">答题完成！</div>
      <div class="quiz-result-score">${score}分</div>
      <div style="font-size:14px;color:#666;margin-bottom:8px;">正确 ${correctCount}/${q.total} 题</div>
      <button class="quiz-btn" onclick="startQuiz(${currentQuiz})">重新挑战</button>
    </div>
  `;
}

function closeQuizModal() {
  document.getElementById('quizModal').classList.remove('show');
}

// ===== TAB SWITCHING =====
document.querySelectorAll('.tab-btn, .nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById(`tab-${tab}`).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');
  });
});

// ===== REFRESH =====
function refreshNews() {
  document.getElementById('lastRefresh').textContent = '刚刚';
  // Simulate new data count
  const count = 128 + Math.floor(Math.random() * 20);
  document.getElementById('newsCount').textContent = count;
}

// Auto refresh time
setInterval(() => {
  const el = document.getElementById('lastRefresh');
  if (el.textContent === '刚刚') el.textContent = '1分钟前';
  else {
    const m = parseInt(el.textContent) || 1;
    el.textContent = (m+1) + '分钟前';
  }
}, 60000);

// ===== INIT =====
renderNews();
renderKnowledge();
renderQuiz();
</script>
